<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Vocabulario LSA</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f4c81 0%, #1e88e5 50%, #00acc1 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; margin: 0; box-sizing: border-box; }
    .contenedor { background: linear-gradient(rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.86)), url('alfabeto manual lsa.jpeg'); background-size: cover; background-position: center; background-repeat: no-repeat; padding: 28px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25); max-width: 720px; width: 100%; }
    h2 { color: #0f4c81; margin: 0 0 6px; font-size: 26px; text-align: center; }
    .subtitulo { text-align: center; color: #37474f; font-weight: 500; margin: 0 0 18px; font-size: 15px; }
    .buscador { display: flex; gap: 10px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 12px 16px; font-size: 16px; border: 2px solid #bbdefb; border-radius: 12px; outline: none; background-color: rgba(255, 255, 255, 0.95); transition: border-color 0.3s, box-shadow 0.3s; }
    input[type="text"]:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2); }
    .btn-buscar { padding: 12px 24px; font-size: 16px; font-weight: bold; background: linear-gradient(135deg, #1e88e5, #00acc1); color: white; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .btn-buscar:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(30, 136, 229, 0.4); }
    video { width: 100%; height: 350px; background-color: #0d1b2a; border-radius: 14px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15); display: block; }
    .controles-velocidad { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .etiqueta-vel { font-size: 14px; font-weight: bold; color: #37474f; }
    .btn-vel { padding: 6px 14px; font-size: 14px; font-weight: 600; border: 2px solid #1e88e5; background-color: rgba(255, 255, 255, 0.92); color: #0f4c81; border-radius: 20px; cursor: pointer; transition: all 0.2s ease; }
    .btn-vel.activo { background: linear-gradient(135deg, #1e88e5, #00acc1); color: #ffffff; border-color: transparent; box-shadow: 0 3px 8px rgba(30, 136, 229, 0.35); }
    .estado { margin-top: 10px; font-size: 15px; color: #0277bd; font-weight: bold; text-align: center; min-height: 20px; }
    .seccion-chips { margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(187, 222, 251, 0.9); }
    .seccion-chips small { color: #37474f; font-weight: bold; display: block; margin-bottom: 8px; }
    .pestanas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pestana { padding: 6px 12px; font-size: 13px; font-weight: 600; border-radius: 10px; border: 1px solid #90caf9; background-color: rgba(255, 255, 255, 0.88); color: #0f4c81; cursor: pointer; transition: all 0.2s ease; }
    .pestana:hover { background-color: #e3f2fd; }
    .pestana.activa { background-color: #0f4c81; color: #ffffff; border-color: #0f4c81; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; max-height: 185px; overflow-y: auto; padding: 4px 2px; }
    .chip { background-color: rgba(227, 242, 253, 0.95); color: #0d47a1; border: 1px solid #bbdefb; padding: 7px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; }
    .chip:hover, .chip.seleccionado { background: linear-gradient(135deg, #1e88e5, #00acc1); color: #ffffff; border-color: transparent; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(30, 136, 229, 0.3); }
    .mensaje-vacio { font-size: 14px; color: #546e7a; font-style: italic; padding: 8px 4px; }
    @media (max-width: 480px) { video { height: 250px; } .buscador { flex-direction: column; } }
  </style>
</head>
<body>
<div class="contenedor">
  <h2>Reproductor de Vocabulario LSA</h2>
  <p class="subtitulo">Elige una categoría, toca una palabra o escribe en el buscador</p>
  <div class="buscador">
    <input type="text" id="texto" placeholder="Ej: cebra, beneficio, triunfo..." />
    <button type="button" class="btn-buscar" onclick="buscarSena()">Reproducir</button>
  </div>
  <video id="reproductor" controls controlsList="nodownload" oncontextmenu="return false;" autoplay muted playsinline></video>
  <div class="controles-velocidad">
    <span class="etiqueta-vel">Velocidad:</span>
    <button type="button" class="btn-vel activo" onclick="cambiarVelocidad(1, this)">Normal (1x)</button>
    <button type="button" class="btn-vel" onclick="cambiarVelocidad(0.5, this)">Cámara lenta (0.5x)</button>
  </div>
  <div class="estado" id="estado"></div>
  <div class="seccion-chips">
    <small>Vocabulario disponible por categoría (haz clic para reproducir):</small>
    <div class="pestanas" id="contenedorPestanas"></div>
    <div class="chips" id="listaVocabulario"></div>
  </div>
</div>
<script>
  const vocabularioPorCategoria = {
    "Animales": { "cebra": "Animales/Cebra.mp4", "lechuza": "Animales/Lechuza o Buho.mp4", "buho": "Animales/Lechuza o Buho.mp4", "vibora": "Animales/Vibora y Serpiente.mp4", "serpiente": "Animales/Vibora y Serpiente.mp4" },
    "Contextos": { "beneficio": "Beneficio.mp4", "beneficios": "Beneficio.mp4", "adquirir": "Contextos/Adquirir.mp4" },
    "Salud": { "sindrome": "Salud/Sindrome.mp4" },
    "Verbos": { "cambiar": "Verbos/Verbos Cambiar.mp4", "atacar": "Vocabularios/Atacar.mp4", "conquistar": "Vocabularios/Conquistar.mp4", "ofrecer": "Vocabularios/Ofrecer.mp4", "vencio": "Vocabularios/Vencio.mp4" },
    "Vocabularios": { "cereales": "Vocabularios/Cereales.mp4", "creencia": "Vocabularios/Creencia.mp4", "dinosaurio": "Vocabularios/Dinosaurio.mp4", "dragon": "Vocabularios/Dragon.mp4", "durazno": "Vocabularios/Durazno.mp4", "encuesta": "Vocabularios/Encuesta.mp4", "frutilla": "Vocabularios/Frutilla.mp4", "idioma portugues": "Vocabularios/Idioma portugues.mp4", "itaembe mini": "Vocabularios/Itaembe Mini.mp4", "mascota": "Vocabularios/Mascota.mp4", "molino": "Vocabularios/Molino.mp4", "moraleja": "Vocabularios/Moraleja.mp4", "oferta": "Vocabularios/Oferta.mp4", "origen": "Vocabularios/Origen.mp4", "original": "Vocabularios/Original.mp4", "oruga": "Vocabularios/Oruga.mp4", "paleontologo": "Vocabularios/Panleontologo.mp4", "portugal": "Vocabularios/Portugal.mp4", "presentimiento": "Vocabularios/Presentimiento.mp4", "subsidio": "Vocabularios/Subcidio.mp4", "talento": "Vocabularios/Talento.mp4", "tero": "Vocabularios/Tero.mp4", "tolerancia": "Vocabularios/Tolerancia.mp4", "triunfo": "Vocabularios/Triunfo.mp4", "urquiza": "Vocabularios/Urquiza.mp4", "wasli": "Vocabularios/WASLI.mp4" },
    "Financieros": {},
    "Procesos": {},
    "Religiones": {}
  };
  const diccionarioLSA = {};
  for (const cat in vocabularioPorCategoria) Object.assign(diccionarioLSA, vocabularioPorCategoria[cat]);

  const reproductor = document.getElementById("reproductor");
  const estado = document.getElementById("estado");
  const inputTexto = document.getElementById("texto");
  const listaVocabulario = document.getElementById("listaVocabulario");
  const contenedorPestanas = document.getElementById("contenedorPestanas");
  let velocidadActual = 1, categoriaActiva = "Todas", palabraActiva = "";
  reproductor.loop = true;

  function normalizar(t) { return t.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function cambiarVelocidad(vel, btn) {
    velocidadActual = vel; reproductor.playbackRate = vel;
    document.querySelectorAll(".btn-vel").forEach(b => b.classList.remove("activo"));
    btn.classList.add("activo");
  }
  function crearPestanas() {
    contenedorPestanas.innerHTML = "";
    ["Todas", ...Object.keys(vocabularioPorCategoria)].forEach(cat => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "pestana" + (cat === categoriaActiva ? " activa" : "");
      btn.textContent = cat;
      btn.onclick = () => { categoriaActiva = cat; inputTexto.value = ""; crearPestanas(); mostrarChips(); };
      contenedorPestanas.appendChild(btn);
    });
  }
  function mostrarChips() {
    listaVocabulario.innerHTML = "";
    const filtro = normalizar(inputTexto.value);
    const fuente = categoriaActiva === "Todas" ? diccionarioLSA : vocabularioPorCategoria[categoriaActiva];
    const palabras = Object.keys(fuente).filter(p => normalizar(p).includes(filtro));
    if (!palabras.length) {
      const aviso = document.createElement("div");
      aviso.className = "mensaje-vacio";
      aviso.textContent = "Aún no hay señas cargadas en esta categoría.";
      listaVocabulario.appendChild(aviso);
      return;
    }
    palabras.forEach(p => {
      const b = document.createElement("span");
      b.className = "chip" + (p === palabraActiva ? " seleccionado" : "");
      b.textContent = p;
      b.onclick = () => { inputTexto.value = p; buscarSena(); };
      listaVocabulario.appendChild(b);
    });
  }
  function buscarSena() {
    const c = normalizar(inputTexto.value);
    if (diccionarioLSA[c]) {
      palabraActiva = c;
      reproductor.src = encodeURI(diccionarioLSA[c]);
      reproductor.playbackRate = velocidadActual;
      reproductor.play().catch(() => {});
      estado.style.color = "#0277bd";
      estado.textContent = "Mostrando seña: " + c;
      mostrarChips();
    } else {
      reproductor.removeAttribute("src");
      reproductor.load();
      estado.style.color = "#c62828";
      estado.textContent = "No se encontró esa palabra en el diccionario.";
    }
  }
  reproductor.onerror = () => { if (reproductor.getAttribute("src")) { estado.style.color = "#c62828"; estado.textContent = "Error al cargar el video."; } };
  inputTexto.addEventListener("input", mostrarChips);
  inputTexto.addEventListener("keypress", e => { if (e.key === "Enter") buscarSena(); });
  crearPestanas();
  mostrarChips();
</script>
</body>
</html>
